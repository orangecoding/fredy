name: Create and publish Docker image

on:
  push:
    branches:
      - 'master'
    # '!*-pre.*' keeps the pre-release tags created by `yarn release:pre` out of the stable
    # image - those are built from develop and belong in fredy-pre-release (see pre-release.yml).
    tags:
      - '*'
      - '!*-pre.*'

jobs:
  docker:
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker-build.yml
    with:
      image_name: ${{ github.repository }}
      # Reproduces the metadata-action defaults this workflow relied on before:
      # master -> :master + :latest, release tag -> :<version>
      tags: |
        type=ref,event=branch
        type=ref,event=tag
        type=raw,value=latest,enable={{is_default_branch}}
