    <script id="__UFRN_LIFECYCLE_SERVERREQUEST__">window["__UFRN_LIFECYCLE_SERVERREQUEST__"]=JSON.parse("{\"app_cldp\":{\"data\":{\"classified\":{\"brand\":\"immowelt\",\"id\":\"26H6IGH14AAQ\",\"title\":\"In Massivbauweise entstehen 2 nebeneinanderliegende Mehrfamilienhäuser - großzügig geplant - mit jeweils 6 Wohnungen, barrierearm inklusive eigenem Aufzug je Gebäude. Energetisch auf dem neusten Stand und mit solider Klinkerfassade passt sich die besondere Architektur des attraktiven Neubauprojekts harmonisch in das Münsterland ein. Jedes Haus wird auf einem eigenen Flurstück gebaut.\\u003cbr\\u003e\\u003cbr\\u003eUnter Einhaltung der allgemein anerkannten Regeln der Technik und Baukunst wird die Energieeffizienzklasse KfW 40 mit dem Siegel \\\"QNG (Qualitätsgesicherte Nachhaltige Gebäude)\\\" erreicht. Die QNG-Bauweise zeichnet sich durch besonders nachhaltige, umweltschonende und ressourcenschonende Bau- und Sanierungsmethoden aus, die den ökologischen Fußabdruck minimieren und gleichzeitig hohe Qualitätsstandards erfüllen.\\u003cbr\\u003e\\u003cbr\\u003eTop Gelegenheit für Kapitalanleger! Mit der neuen Bauweise bieten sich attraktive Chancen: Durch die geschickte Kombination der 5 % Sonderabschreibung gemäß § 7b EStG und 5 % degressive Abschreibung nach § 7 Abs. 5a EstG lassen sich innerhalb der ersten vier Jahre bis zu 38,5 % des Gebäudewerts abschreiben. Zusätzlich stehen zinsgünstige KfW-Darlehen Programm 297 zur Verfügung, um energieeffiziente Neubauten noch rentabler zu gestalten.\\u003cbr\\u003e\\u003cbr\\u003eOb Balkon oder Terrasse einschließlich Gartenanteil mit Sondernutzungsrecht: Alle Freisitze verfügen über eine einmalig schöne Ausrichtung nach Süden. Die tolle Lage begeistert durch Stadtnähe, fußläufige Nahversorgung (Supermärkte, usw.)  und gleichzeitige Nähe zur Natur. Beide Häuser erhalten jeweils 9 PKW-Außenstellplätze und einen gesonderten Außenstellplatz für Fahrräder, beides ansprechend und praktisch seitlich von den Bauvorhaben angeordnet.\ \",\"url\":\"https://mms.immowelt.de/2/2/e/4/22e43f4f-6ef2-4da2-9a1d-f837b29cc93c.jpg?ci_seal=18e453d3f8b35aa04b65ae7c8680562106cc4999\",\"description\":\"Grundriss Haus 1 I Whg. 4\",\"classification\":{\"name\":\"FLOORPLAN\",\"version\":\"scene-classification-sagemaker-endpoint-live-1-3-10\"}},{\"id\":\"2ab84e6c-7305-4809-8b0a-b47cf50fc799\",\"key\":\"2ab84e6c-7305-4809-8b0a-b47cf50fc799-9\",\"url\":\"https://mms.immowelt.de/2/a/b/8/2ab84e6c-7305-4809-8b0a-b47cf50fc799.jpg?ci_seal=c6fc84eb56fe64b648568f56dc196bee68dafe6d\",\"description\":\"Grundriss Haus 1 I Whg. 5 \",\"classification\":{\"name\":\"FLOORPLAN\",\"version\":\"scene-classification-sagemaker-endpoint-live-1-3-10\"}},{\"id\":\"025f3c56-73ff-4f10-bf1d-cdc0f6e426d7\",\"key\":\"025f3c56-73ff-4f10-bf1d-cdc0f6e426d7-10\",\"url\":\"https://mms.immowelt.de/0/2/5/f/025f3c56-73ff-4f10-bf1d-cdc0f6e426d7.jpg?ci_seal=45f9eb4e6a84cabab74c99aeeacfc418dd7a3be3\",\"description\":\"Grundriss Haus 1 I Whg. 6\",\"classification\":{\"name\":\"FLOORPLAN\",\"version\":\"scene-classification-sagemaker-endpoint-live-1-3-10\"}},{\"id\":\"2de44f28-e224-4c3a-b0c8-592913bc068c\",\"key\":\"2de44f28-e224-4c3a-b0c8-592913bc068c-11\",\"url\":\"https://mms.immowelt.de/2/d/e/4/2de44f28-e224-4c3a-b0c8-592913bc068c.jpg?ci_seal=6f49147a8e99fbfb19c1428d971ab73f84e3bae8\",\"description\":\"Grundriss Haus 1 Wohnungsvariante\",\"classification\":{\"name\":\"FLOORPLAN\",\"version\":\"scene-classification-sagemaker-endpoint-live-1-3-10\"}},{\"id\":\"a46128b3-9127-4c7e-b6d9-4655b094c03b\",\"key\":\"a46128b3-9127-4c7e-b6d9-4655b094c03b-12\",\"url\":\"https://mms.immowelt.de/a/4/6/1/a46128b3-9127-4c7e-b6d9-4655b094c03b.jpg?ci_seal=087c362d69c49c3e3bd19cf1439007ea697efd46\",\"description\":\"Kellergeschoss\",\"classification\":{\"name\":\"FLOORPLAN\",\"version\":\"scene-classification-sagemaker-endpoint-live-1-3-10\"}}],\"videos\":[],\"virtualTours\":[]}},\"sections\":{\"location\":{\"address\":{\"country\":\"DEU\",\"city\":\"Sassenberg\",\"zipCode\":\"48336\",\"street\":\"Christian-Rath-Straße 2\"},\"isAddressPublished\":true,\"geometry\":{\"type\":\"Point\",\"coordinates\":[8.038257598876953,51.98283386230469]}},\"description\":{\"description\":\"In Massivbauweise entstehen 2 nebeneinanderliegende Mehrfamilienhäuser - großzügig geplant - mit jeweils 6 Wohnungen, barrierearm inklusive eigenem Aufzug je Gebäude. Energetisch auf dem neusten Stand und mit solider Klinkerfassade passt sich die besondere Architektur des attraktiven Neubauprojekts harmonisch in das Münsterland ein. Jedes Haus wird auf einem eigenen Flurstück gebaut.\\u003cbr\\u003e\\u003cbr\\u003eUnter Einhaltung der allgemein anerkannten Regeln der Technik und Baukunst wird die Energieeffizienzklasse KfW 40 mit dem Siegel \\\"QNG (Qualitätsgesicherte Nachhaltige Gebäude)\\\" erreicht. Die QNG-Bauweise zeichnet sich durch besonders nachhaltige, umweltschonende und ressourcenschonende Bau- und Sanierungsmethoden aus, die den ökologischen Fußabdruck minimieren und gleichzeitig hohe Qualitätsstandards erfüllen.\\u003cbr\\u003e\\u003cbr\\u003eTop Gelegenheit für Kapitalanleger! Mit der neuen Bauweise bieten sich attraktive Chancen: Durch die geschickte Kombination der 5 % Sonderabschreibung gemäß § 7b EStG und 5 % degressive Abschreibung nach § 7 Abs. 5a EstG lassen sich innerhalb der ersten vier Jahre bis zu 38,5 % des Gebäudewerts abschreiben. Zusätzlich stehen zinsgünstige KfW-Darlehen Programm 297 zur Verfügung, um energieeffiziente Neubauten noch rentabler zu gestalten.\\u003cbr\\u003e\\u003cbr\\u003eOb Balkon oder Terrasse einschließlich Gartenanteil mit Sondernutzungsrecht: Alle Freisitze verfügen über eine einmalig schöne Ausrichtung nach Süden. Die tolle Lage begeistert durch Stadtnähe, fußläufige Nahversorgung (Supermärkte, usw.)  und gleichzeitige Nähe zur Natur. Beide Häuser erhalten jeweils 9 PKW-Außenstellplätze und einen gesonderten Außenstellplatz für Fahrräder, beides ansprechend und praktisch seitlich von den Bauvorhaben angeordnet.\\u003cbr\\u003e\\u003cbr\\u003eVerfügbare Einheiten:\\u003cbr\\u003e\\u003cbr\\u003eErdgeschoss: 4 Zimmer, 97,00 m²\\u003cbr\\u003eErdgeschoss: 4 Zimmer, 96,30 m²\\u003cbr\\u003eObergeschoss: 4 Zimmer, 95,60 m²\\u003cbr\\u003eObergeschoss: 4 Zimmer, 95,60 m²\\u003cbr\\u003eDachgeschoss: 3 Zimmer, 76,30 m²\\u003cbr\\u003eDachgeschoss: 2 Zimmer, 71,20 m² \\n\\nLage\\nSüdlich der Christian-Rath-Straße (genauer Spoedestraße 5 und 7), im Geltungsbereich des Bebauungsplanes (B-Plan), erstreckt sich das frische Baugebiet, das für die Errichtung von Wohnhäusern zum Ende 2024 freigegeben wurde. Dieses Gebiet grenzt im weiteren Osten an den Tatenhauser Weg, im Westen an die Schürenerstraße, und bietet durch seine Nähe zur Innenstadt eine attraktive Lage für Eigenheime und Wohnungen. \\u003cbr\\u003e\\u003cbr\\u003eIn der näheren Umgebung befinden sich mehrere Kindergärten, Schulen und Freizeitmöglichkeiten wie z. B. ein Sportplatz, Freibad und Wanderwege - eine attraktive Gegend nicht nur für junge Familien. Die Nahversorgung ist durch Supermärkte, Bäcker, Post und Geschäfte sehr gut gewährleistet. Sassenberg ist an das Busnetz angeschlossen, innerorts wie auch umliegend. Eine Haltestelle ist in wenigen Minuten zu Fuß erreicht. Der nächste Bahnhof befindet sich in Warendorf, ca. 7 km entfernt. Er wird regelmäßig von Zügen aus Münster, Bielefeld, Gütersloh und Rheda-Wiedenbrück angefahren.\\u003cbr\\u003e\\u003cbr\\u003eSassenberg ist eine kleine Stadt im nordrhein-westfälischen Kreis Warendorf. Sie befindet sich etwa 30 Kilometer nordwestlich von Münster und rund 20 Kilometer südwestlich von Hamm und liegt fast gleich weit entfernt von beiden größeren Städten im Münsterland. Hier lebt es sich grün und friedlich. An das regionale Verkehrsnetz ist Sassenberg öffentlich gut angebunden. \\n\\nWeitere Informationen\\nSonstiges\\nZukunftsorientiertes Wohnen mittels hoher Energieeffizienz: Die Heizungsanlage wird mit einer modernen Luft-Wasser-Wärmepumpe einschließlich Warmwasserbereitung gemäß EnEV-Nachweis betrieben. Der zusätzlich gewonnene Strom aus der installierten Photovoltaik-Anlage (ebenfalls gemäß EnEV-Nachweis) wird für die Wärmepumpe genutzt. Der Verbrauch von Kalt- und Warmwasser sowie der Heizenergie wird für jede Wohnung verbrauchsorientiert gemessen.\\u003cbr\\u003e\\u003cbr\\u003eDurch die massive Bauweise und der schallentkoppelten Stahlbetondeckenkonstruktion wird ein Schallschutz oberhalb der gesetzlichen Anforderungen nach DIN 4109 erreicht.\\u003cbr\\u003e\\u003cbr\\u003eIm freundlich gestalteten Außenbereich werden Zuwegungen mittels anthrazitfarbenen Betonpflastersteinen ausgestattet und im Bereich der Gemeinschafts- und Sondernutzungsflächen wird Mutterboden angefüllt. Die Raseneinsaat und Anpflanzung von pflegeleichten Rotbuchenhecke sind im Leistungsumfang enthalten.\\u003cbr\\u003e\\u003cbr\\u003eFür jeden Pkw-Stellplatz wird über ein Lastmanagementsystem einschl. elektrischer Zuleitung die Möglichkeit eröffnet, ein E-Fahrzeug zu laden. Die jeweilige system- und versorgerabhängige Lieferung und Montage der Ladebox (Wallbox) am Stellplatz ist nicht mit dem Kaufpreis abgegolten, sie ist bei Bedarf durch die Erwerbenden auf eigene Kosten zu erstellen. Ferner wird je Wohneinheit im Rahmen einer Überdachung ein Fahrradbügel plus Doppelsteckdose für das Laden von E-Bikes installiert.\\n\\nStichworte\\nNutzfläche: 92,50 m², Anzahl Terrassen: 1, 3 Etagen\",\"texts\":[{\"text\":\"In Massivbauweise entstehen 2 nebeneinanderliegende Mehrfamilienhäuser - großzügig geplant - mit jeweils 6 Wohnungen, barrierearm inklusive eigenem Aufzug je Gebäude. Energetisch auf dem neusten Stand und mit solider Klinkerfassade passt sich die besondere Architektur des attraktiven Neubauprojekts harmonisch in das Münsterland ein. Jedes Haus wird auf einem eigenen Flurstück gebaut.\\u003cbr\\u003e\\u003cbr\\u003eUnter Einhaltung der allgemein anerkannten Regeln der Technik und Baukunst wird die Energieeffizienzklasse KfW 40 mit dem Siegel \\\"QNG (Qualitätsgesicherte Nachhaltige Gebäude)\\\" erreicht. Die QNG-Bauweise zeichnet sich durch besonders nachhaltige, umweltschonende und ressourcenschonende Bau- und Sanierungsmethoden aus, die den ökologischen Fußabdruck minimieren und gleichzeitig hohe Qualitätsstandards erfüllen.\\u003cbr\\u003e\\u003cbr\\u003eTop Gelegenheit für Kapitalanleger! Mit der neuen Bauweise bieten sich attraktive Chancen: Durch die geschickte Kombination der 5 % Sonderabschreibung gemäß § 7b EStG und 5 % degressive Abschreibung nach § 7 Abs. 5a EstG lassen sich innerhalb der ersten vier Jahre bis zu 38,5 % des Gebäudewerts abschreiben. Zusätzlich stehen zinsgünstige KfW-Darlehen Programm 297 zur Verfügung, um energieeffiziente Neubauten noch rentabler zu gestalten.\\u003cbr\\u003e\\u003cbr\\u003eOb Balkon oder Terrasse einschließlich Gartenanteil mit Sondernutzungsrecht: Alle Freisitze verfügen über eine einmalig schöne Ausrichtung nach Süden. Die tolle Lage begeistert durch Stadtnähe, fußläufige Nahversorgung (Supermärkte, usw.)  und gleichzeitige Nähe zur Natur. Beide Häuser erhalten jeweils 9 PKW-Außenstellplätze und einen gesonderten Außenstellplatz für Fahrräder, beides ansprechend und praktisch seitlich von den Bauvorhaben angeordnet.\\u003cbr\\u003e\\u003cbr\\u003eVerfügbare Einheiten:\\u003cbr\\u003e\\u003cbr\\u003eErdgeschoss: 4 Zimmer, 97,00 m²\\u003cbr\\u003eErdgeschoss: 4 Zimmer, 96,30 m²\\u003cbr\\u003eObergeschoss: 4 Zimmer, 95,60 m²\\u003cbr\\u003eObergeschoss: 4 Zimmer, 95,60 m²\\u003cbr\\u003eDachgeschoss: 3 Zimmer, 76,30 m²\\u003cbr\\u003eDachgeschoss: 2 Zimmer, 71,20 m²\"},{\"headline\":\"Lage\",\"text\":\"Südlich der Christian-Rath-Straße (genauer Spoedestraße 5 und 7), im Geltungsbereich des Bebauungsplanes (B-Plan), erstreckt sich das frische Baugebiet, das für die Errichtung von Wohnhäusern zum Ende 2024 freigegeben wurde. Dieses Gebiet grenzt im weiteren Osten an den Tatenhauser Weg, im Westen an die Schürenerstraße, und bietet durch seine Nähe zur Innenstadt eine attraktive Lage für Eigenheime und Wohnungen. \\u003cbr\\u003e\\u003cbr\\u003eIn der näheren Umgebung befinden sich mehrere Kindergärten, Schulen und Freizeitmöglichkeiten wie z. B. ein Sportplatz, Freibad und Wanderwege - eine attraktive Gegend nicht nur für junge Familien. Die Nahversorgung ist durch Supermärkte, Bäcker, Post und Geschäfte sehr gut gewährleistet. Sassenberg ist an das Busnetz angeschlossen, innerorts wie auch umliegend. Eine Haltestelle ist in wenigen Minuten zu Fuß erreicht. Der nächste Bahnhof befindet sich in Warendorf, ca. 7 km entfernt. Er wird regelmäßig von Zügen aus Münster, Bielefeld, Gütersloh und Rheda-Wiedenbrück angefahren.\\u003cbr\\u003e\\u003cbr\\u003eSassenberg ist eine kleine Stadt im nordrhein-westfälischen Kreis Warendorf. Sie befindet sich etwa 30 Kilometer nordwestlich von Münster und rund 20 Kilometer südwestlich von Hamm und liegt fast gleich weit entfernt von beiden größeren Städten im Münsterland. Hier lebt es sich grün und friedlich. An das regionale Verkehrsnetz ist Sassenberg öffentlich gut angebunden.\"},{\"headline\":\"Weitere Informationen\",\"text\":\"Sonstiges\\nZukunftsorientiertes Wohnen mittels hoher Energieeffizienz: Die Heizungsanlage wird mit einer modernen Luft-Wasser-Wärmepumpe einschließlich Warmwasserbereitung gemäß EnEV-Nachweis betrieben. Der zusätzlich gewonnene Strom aus der installierten Photovoltaik-Anlage (ebenfalls gemäß EnEV-Nachweis) wird für die Wärmepumpe genutzt. Der Verbrauch von Kalt- und Warmwasser sowie der Heizenergie wird für jede Wohnung verbrauchsorientiert gemessen.\\u003cbr\\u003e\\u003cbr\\u003eDurch die massive Bauweise und der schallentkoppelten Stahlbetondeckenkonstruktion wird ein Schallschutz oberhalb der gesetzlichen Anforderungen nach DIN 4109 erreicht.\\u003cbr\\u003e\\u003cbr\\u003eIm freundlich gestalteten Außenbereich werden Zuwegungen mittels anthrazitfarbenen Betonpflastersteinen ausgestattet und im Bereich der Gemeinschafts- und Sondernutzungsflächen wird Mutterboden angefüllt. Die Raseneinsaat und Anpflanzung von pflegeleichten Rotbuchenhecke sind im Leistungsumfang enthalten.\\u003cbr\\u003e\\u003cbr\\u003eFür jeden Pkw-Stellplatz wird über ein Lastmanagementsystem einschl. elektrischer Zuleitung die Möglichkeit eröffnet, ein E-Fahrzeug zu laden. Die jeweilige system- und versorgerabhängige Lieferung und Montage der Ladebox (Wallbox) am Stellplatz ist nicht mit dem Kaufpreis abgegolten, sie ist bei Bedarf durch die Erwerbenden auf eigene Kosten zu erstellen. Ferner wird je Wohneinheit im Rahmen einer Überdachung ein Fahrradbügel plus Doppelsteckdose für das Laden von E-Bikes installiert.\\n\\nStichworte\\nNutzfläche: 92,50 m², Anzahl Terrassen: 1, 3 Etagen\"}],\"headline\":\"Investorenprojekt! Hochmodernes Mehrfamilienhaus mit 6 Wohnungen (KfW 40 + QNG)\"},\"hardFacts\":{\"title\":\"Mehrfamilienhaus zum Kauf\",\"titleAdditions\":[\"als Kapitalanlage geeignet\"],\"keyfacts\":[\"532 m²\",\"809 m² Grundstück\"],\"facts\":[{\"type\":\"overallSpace\",\"value\":\"532 m²\",\"splitValue\":\"532\",\"label\":\"m²\"},{\"type\":\"plotSpace\",\"value\":\"809 m² Grundstück\",\"splitValue\":\"809\",\"label\":\"m² Grundstück\"}],\"locationDescription\":\"Südlich der Christian-Rath-Straße (genauer Spoedestraße 5 und 7), im Geltungsbereich des Bebauungsplanes (B-Plan), erstreckt sich das frische Baugebiet, das für die Errichtung von Wohnhäusern zum Ende 2024 freigegeben wurde. Dieses Gebiet grenzt im weiteren Osten an den Tatenhauser Weg, im Westen an die Schürenerstraße, und bietet durch seine Nähe zur Innenstadt eine attraktive Lage für Eigenheime und Wohnungen. \\u003cbr\\u003e\\u003cbr\\u003eIn der näheren Umgebung befinden sich mehrere Kindergärten, Schulen und Freizeitmöglichkeiten wie z. B. ein Sportplatz, Freibad und Wanderwege - eine attraktive Gegend nicht nur für junge Familien. Die Nahversorgung ist durch Supermärkte, Bäcker, Post und Geschäfte sehr gut gewährleistet. Sassenberg ist an das Busnetz angeschlossen, innerorts wie auc xposé ist beispielhaft das Haus 1 beschrieben, Spoedestraße 5. Es umfasst 6 Einheiten mit jeweils 2 Wohnungen im Erdgeschoss, Obergeschoss und im Dachgeschoss. Jeder Wohnung ist ein privater Kellerraum zugehörig. Die gesamte Wohnfläche beträgt ca. 532 m² bei einer Grundstücksgröße von 809 m².\\u003cbr\\u003e\\u003cbr\\u003eHochwertige Ausstattung und perfekt geschnittene Grundrisse mit Wohnflächen von ca. 71 m² bis ca. 97 m² ermöglichen ideale Wohnkonzepte verteilt auf jeweils zwei, drei oder vier Zimmer. So sind z. B. alle Wohnungen modern mit offenem Küchen-/Ess-/Wohnbereich ausgestattet, besitzen einen Abstellraum und haben ein Badezimmer mit Fenster. Die Grundrissvariante ist für alle Wohnungen im EG und OG möglich. Terrassen der EG-Wohnungen erhalten eine frostsichere Außenzapfstelle.\\u003cbr\\u003e\\u003cbr\\u003eWeitere Ausstattungsmerkmale:\\u003cbr\\u003e\\u003cbr\\u003e+ elektrische Rollläden \\u003cbr\\u003e+ Fenster mit Dreifachverglasung\\u003cbr\\u003e+ Fußbodenheizung\\u003cbr\\u003e+ Wohnungsinnentüren 2,135 m hoch\\u003cbr\\u003e+ elegante Sanitärobjekte\\u003cbr\\u003e+ bodengleich gefliester Duschbereich\\u003cbr\\u003e+ elektrischer Bad- und Designheizkörper\\u003cbr\\u003e+ Gegensprechanlage\\u003cbr\\u003e+ Aufzug (geräuscharme Hydraulik)\\u003cbr\\u003e+ gemeinsamer Kellerwaschraum\\u003cbr\\u003e\\u003cbr\\u003eAlle Räume der einzelnen Wohnungen erhalten Vinylbodenbelag, die Böden im (Gäste-)WC und Bad werden gefliest, die Wände ebenfalls teilweise (Wandfliesen, weiß, mit glänzender Oberfläche und Bodenfliesen, anthrazit, mit matter Oberfläche). Malerarbeiten sind inkludiert: Decken und Wände werden mit Malervlies belegt und mit hochwertiger Dispersionsfarbe gestrichen!\"}},\"documents\":{\"display\":false,\"files\":[]},\"enrichedMedia\":{\"medias\":[]},\"mortgage\":{\"brand\":\"immowelt\",\"id\":\"8e1049f3-8f9e-481d-a666-a635fba60191\",\"priceComparisonLink\":{\"text\":\"Deutschland\",\"link\":\"https://www.immowelt.de/immobilienpreise/deutschland\"},\"federalStateGeoId\":\"AD04DE5\",\"zip\":\"48336\",\"city\":\"Sassenberg\",\"country\":\"DEU\",\"subType\":\"RESALE\",\"region\":\"Nordrhein-Westfalen\",\"showRentLabel\":false,\"showMonthlyRateLabel\":true,\"price\":2474300,\"prov\":3.5699999999999994,\"monthlyAmount\":8695,\"formattedMonthlyAmount\":\"8.695\"},\"partnerAd\":{\"showPartnerAd\":true},\"sellerLeadLink\":{\"funnel\":\"https://www.immowelt.de/immobilienbewertung/preisrechner\",\"landing\":\"https://www.immowelt.de/immobilienbewertung\"},\"priceComparison\":{\"data\":{\"value\":2631,\"accuracy\":4,\"high\":\"4.496\",\"low\":\"1.560\"},\"markerPosition\":100,\"hasMainPrice\":true,\"isSale\":true,\"pricePerSqm\":\"4.650,94\",\"legalText\":\"Der angegebene Quadratmeterpreis wurde von AVIV Germany automatisch anhand des angegebenen Verkaufspreises und der angegebenen Quadratmeterzahl des Objektes berechnet. Der Vergleichswert basiert auf den verfügbaren Marktwerten zu Objekten ähnlicher Beschaffenheit und Lage. Diese Angaben können eine gutachterliche Bewertung nicht ersetzen, da diese immer auch vom Zustand und der Lage des konkreten Objektes abhängig ist.\",\"priceComparisonLink\":{\"text\":\"Deutschland\",\"link\":\"https://www.immowelt.de/immobilienpreise/deutschland\"},\"investmentValues\":[{\"key\":\"upper_values\",\"values\":[{\"key\":\"is_for_investment\",\"label\":\"als Kapitalanlage geeignet\",\"value\":\"ja\"}]}]},\"mainDescription\":{\"headline\":\"Investorenprojekt! Hochmodernes Mehrfamilienhaus mit 6 Wohnungen (KfW 40 + QNG)\",\"description\":\"In Massivbauweise entstehen 2 nebeneinanderliegende Mehrfamilienhäuser - großzügig geplant - mit jeweils 6 Wohnungen, barrierearm inklusive eigenem Aufzug je Gebäude. Energetisch auf dem neusten Stand und mit solider Klinkerfassade passt sich die besondere Architektur des attraktiven Neubauprojekts harmonisch in das Münsterland ein. Jedes Haus wird auf einem eigenen Flurstück gebaut.\\u003cbr\\u003e\\u003cbr\\u003eUnter Einhaltung der allgemein anerkannten Regeln der Technik und Baukunst wird die Energieeffizienzklasse KfW 40 mit dem Siegel \\\"QNG (Qualitätsgesicherte Nachhaltige Gebäude)\\\" erreicht. Die QNG-Bauweise zeichnet sich durch besonders nachhaltige, umweltschonende und ressourcenschonende Bau- und Sanierungsmethoden aus, die den ökologischen Fußabdruck minimieren und gleichzeitig hohe Qualitätsstandards erfüllen.\\u003cbr\\u003e\\u003cbr\\u003eTop Gelegenheit für Kapitalanleger! Mit der neuen Bauweise bieten sich attraktive Chancen: Durch die geschickte Kombination der 5 % Sonderabschreibung gemäß § 7b EStG und 5 % degressive Abschreibung nach § 7 Abs. 5a EstG lassen sich innerhalb der ersten vier Jahre bis zu 38,5 % des Gebäudewerts abschreiben. Zusätzlich stehen zinsgünstige KfW-Darlehen Programm 297 zur Verfügung, um energieeffiziente Neubauten noch rentabler zu gestalten.\\u003cbr\\u003e\\u003cbr\\u003eOb Balkon oder Terrasse einschließlich Gartenanteil mit Sondernutzungsrecht: Alle Freisitze verfügen über eine einmalig schöne Ausrichtung nach Süden. Die tolle Lage begeistert durch Stadtnähe, fußläufige Nahversorgung (Supermärkte, usw.)  und gleichzeitige Nähe zur Natur. Beide Häuser erhalten jeweils 9 PKW-Außenstellplätze und einen gesonderten Außenstellplatz für Fahrräder, beides ansprechend und praktisch seitlich von den Bauvorhaben angeordnet.\\u003cbr\\u003e\\u003cbr\\u003eVerfügbare Einheiten:\\u003cbr\\u003e\\u003cbr\\u003eErdgeschoss: 4 Zimmer, 97,00 m²\\u003cbr\\u003eErdgeschoss: 4 Zimmer, 96,30 m²\\u003cbr\\u003eObergeschoss: 4 Zimmer, 95,60 m²\\u003cbr\\u003eObergeschoss: 4 Zimmer, 95,60 m²\\u003cbr\\u003eDachgeschoss: 3 Zimmer, 76,30 m²\\u003cbr\\u003eDachgeschoss: 2 Zimmer, 71,20 m²\",\"metadata\":{\"language\":\"de\"}},\"areaDescription\":{\"headline\":\"Lage\",\"description\":\"Südlich der Christian-Rath-Straße (genauer Spoedestraße 5 und 7), im Geltungsbereich des Bebauungsplanes (B-Plan), erstreckt sich das frische Baugebiet, das für die Errichtung von Wohnhäusern zum Ende 2024 freigegeben wurde. Dieses Gebiet grenzt im weiteren Osten an den Tatenhauser Weg, im Westen an die Schürenerstraße, und bietet durch seine Nähe zur Innenstadt eine attraktive Lage für Eigenheime und Wohnungen. \\u003cbr\\u003e\\u003cbr\\u003eIn der näheren Umgebung befinden sich mehrere Kindergärten, Schulen und Freizeitmöglichkeiten wie z. B. ein Sportplatz, Freibad und Wanderwege - eine attraktive Gegend nicht nur für junge Familien. Die Nahversorgung ist durch Supermärkte, Bäcker, Post und Geschäfte sehr gut gewährleistet. Sassenberg ist an das Busnetz angeschlossen, innerorts wie auch umliegend. Eine Haltestelle ist in wenigen Minuten zu Fuß erreicht. Der nächste Bahnhof befindet sich in Warendorf, ca. 7 km entfernt. Er wird regelmäßig von Zügen aus Münster, Bielefeld, Gütersloh und Rheda-Wiedenbrück angefahren.\\u003cbr\\u003e\\u003cbr\\u003eSassenberg ist eine kleine Stadt im nordrhein-westfälischen Kreis Warendorf. Sie befindet sich etwa 30 Kilometer nordwestlich von Münster und rund 20 Kilometer südwestlich von Hamm und liegt fast gleich weit entfernt von beiden größeren Städten im Münsterland. Hier lebt es sich grün und friedlich. An das regionale Verkehrsnetz ist Sassenberg öffentlich gut angebunden.\",\"metadata\":{\"language\":\"de\"}},\"extendedInfoDescription\":{\"headline\":\"Weitere Informationen\",\"description\":\"Sonstiges\\nZukunftsorientiertes Wohnen mittels hoher Energieeffizienz: Die Heizungsanlage wird mit einer modernen Luft-Wasser-Wärmepumpe einschließlich Warmwasserbereitung gemäß EnEV-Nachweis betrieben. Der zusätzlich gewonnene Strom aus der installierten Photovoltaik-Anlage (ebenfalls gemäß EnEV-Nachweis) wird für die Wärmepumpe genutzt. Der Verbrauch von Kalt- und Warmwasser sowie der Heizenergie wird für jede Wohnung verbrauchsorientiert gemessen.\\u003cbr\\u003e\\u003cbr\\u003eDurch die massive Bauweise und der schallentkoppelten Stahlbetondeckenkonstruktion wird ein Schallschutz oberhalb der gesetzlichen Anforderungen nach DIN 4109 erreicht.\\u003cbr\\u003e\\u003cbr\\u003eIm freundlich gestalteten Außenbereich werden Zuwegungen mittels anthrazitfarbenen Betonpflastersteinen ausgestattet und im Bereich der Gemeinschafts- und Sondernutzungsflächen wird Mutterboden angefüllt. Die Raseneinsaat und Anpflanzung von pflegeleichten Rotbuchenhecke sind im Leistungsumfang enthalten.\\u003cbr\\u003e\\u003cbr\\u003eFür jeden Pkw-Stellplatz wird über ein Lastmanagementsystem einschl. elektrischer Zuleitung die Möglichkeit eröffnet, ein E-Fahrzeug zu laden. Die jeweilige system- und versorgerabhängige Lieferung und Montage der Ladebox (Wallbox) am Stellplatz ist nicht mit dem Kaufpreis abgegolten, sie ist bei Bedarf durch die Erwerbenden auf eigene Kosten zu erstellen. Ferner wird je Wohneinheit im Rahmen einer Überdachung ein Fahrradbügel plus Doppelsteckdose für das Laden von E-Bikes installiert.\\n\\nStichworte\\nNutzfläche: 92,50 m², Anzahl Terrassen: 1, 3 Etagen\",\"metadata\":{\"language\":\"de\"}}},\"contactSections\":{\"id\":\"26H6IGH14AAQ\",\"legacyId\":\"8e1049f3-8f9e-481d-a666-a635fba60191\",\"brand\":\"immowelt\",\"agencyId\":\"3525454\",\"static\":{\"phoneNumbers\":[\"02521 85 39 800\",\"0170 280 50 07\"]},\"sticky\":{\"phoneNumbers\":[\"02521 85 39 800\",\"0170 280 50 07\"]},\"contactCard\":{\"title\":\"Wecker Immobilien e.K.\",\"subtitle\":\"Herr Oliver Wecker\",\"phoneNumbers\":[\"02521 85 39 800\",\"0170 280 50 07\"],\"isPrivateOwner\":false,\"agencyLogo\":{\"logoUrl\":\"https://mms.immowelt.de/3/d/c/8/3dc8bf97-8166-41d8-bb0c-0c6f70bf638a.jpg?ci_seal=af5b97c55e9a9f1f0422d0039bcd90da4c0863b9\",\"display\":true},\"contactLogo\":{\"logoUrl\":null,\"display\":false},\"rating\":4.8},\"contactForm\":{\"contactCard\":{\"title\":\"Wecker Immobilien e.K.\",\"subtitle\":\"Herr Oliver Wecker\",\"phoneNumbers\":[\"02521 85 39 800\",\"0170 280 50 07\"],\"isPrivateOwner\":false,\"logoUrl\":\"https://mms.immowelt.de/3/d/c/8/3dc8bf97-8166-41d8-bb0c-0c6f70bf638a.jpg?ci_seal=af5b97c55e9a9f1f0422d00
